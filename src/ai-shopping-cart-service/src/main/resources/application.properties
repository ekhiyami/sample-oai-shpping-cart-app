logging.level.org.hibernate.SQL=INFO

server.error.include-message = always

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ai_shopping_cart}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update

azure.openai.apikey=${AZURE_OPENAI_API_KEY:}
azure.openai.endpoint=${AZURE_OPENAI_ENDPOINT:}
azure.openai.deployment.id=${AZURE_OPENAI_DEPLOYMENT_ID:}
azure.openai.max-completion-tokens=${AZURE_OPENAI_MAX_COMPLETION_TOKENS:3072}
azure.openai.reasoning-effort=${AZURE_OPENAI_REASONING_EFFORT:minimal}
shopping.cart.ai.mock=${SHOPPING_CART_AI_MOCK:false}

ai.activity.model=${AZURE_OPENAI_MODEL_NAME:gpt-5-mini}

chat.enabled=${CHAT_ENABLED:false}
chat.owner-id=${CHAT_OWNER_ID:}
chat.origin=${CHAT_ORIGIN:}

rag.enabled=${RAG_ENABLED:false}
rag.search.endpoint=${RAG_SEARCH_ENDPOINT:}
rag.search.key=${RAG_SEARCH_API_KEY:}
rag.search.index=${RAG_SEARCH_INDEX:nutrition-v1}
rag.corpus-version=${RAG_CORPUS_VERSION:1.0}
nutrition.lookup.enabled=${NUTRITION_LOOKUP_ENABLED:false}
chat.ai-enabled=${CHAT_AI_ENABLED:false}
